name: unzip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract
        run: |
          set -e
          ZIP=$(ls -1 *.zip | head -n1)
          echo "extracting $ZIP"
          unzip -o "$ZIP" -d extracted
          rm "$ZIP"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "unzip source" || true
          git push
