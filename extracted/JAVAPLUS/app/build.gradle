plugins {
    id 'com.android.application'
    id 'org.lsposed.lsparanoid'
    id 'top.niunaijun.blackobfuscator'
}



class Scrambler {
    Random random = new Random()

    String getRandomString(int i) {
        return random.with {(1..(6 + random.nextInt(i))).collect {(('a'..'z')).join()[ nextInt((('a'..'z')).join().length())]}.join()}
    }
}

Scrambler scrambler = new Scrambler()

android {
    namespace 'com.bgmi'
    compileSdk 34
    
    signingConfigs {
        debug {
            storeFile file("shayksig.jks")
            storePassword "shayk12"
            keyPassword "shayk12"
            keyAlias "Shayk"
        }
        release {
            storeFile file("shayksig.jks")
            storePassword "shayk12"
            keyPassword "shayk12"
            keyAlias "Shayk"
        }
    }
    
    lint {
        baseline = file("lint-baseline.xml")
    }

    defaultConfig {
        applicationId "com.bgmi"
        minSdk 24
        //noinspection OldTargetApi,EditedTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 1
        versionName "2026.06.12"

        vectorDrawables {
            useSupportLibrary true
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }

        multiDexEnabled  false
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false // Temporarily disable to check if it's the cause
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lsparanoid {
        seed = 1919810
        global = false
        includeDependencies = false
        variantFilter = { true }
    }

BlackObfuscator {
    enabled true
    depth 3
    obfClass = [
     
        "com.bgmi.BoxApplication",
      "com.bgmi.MAct",
       "com.bgmi.utils.DownTwo",
        "com.bgmi.LogAct"
     
    ]
    // Exclude the Zcore library (already obfuscated) so its fields/classes
    // aren't re-obfuscated and collide with the vendor's names.
    blackClass = [
        "com.zcore.**",
        "black.**"
    ]
    // Remove obfMethod since it's not a valid property in the BlackObfuscator configuration
}


    buildFeatures {
        viewBinding true
        buildConfig true
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }

    }
    ndkVersion "24.0.8215888"
}

dependencies {
    implementation project(':Zcore')
    
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'net.lingala.zip4j:zip4j:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'com.github.techinessoverloaded:progress-dialog:1.5.1'
    implementation "com.github.topjohnwu.libsu:core:3.1.1"
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
}

